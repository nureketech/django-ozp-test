# Nginx: статика мен суреттерді өзі береді, қалғанын Gunicorn-ға жібереді.
# Орнату: sudo cp deploy/nginx.conf /etc/nginx/sites-available/ozp-test
#         sudo ln -s /etc/nginx/sites-available/ozp-test /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
# test.example.kz орнына өз доменіңізді жазыңыз.
# HTTPS (443 порт) бөлігін кейін `certbot --nginx` өзі қосады.

# Кіру бетіне шектеу: студент ИИН мен 8 цифрлы кодпен кіреді, сондықтан кодты
# теріп табуға тырысуды баяулатамыз. Тек POST (кіру әрекеті) саналады: бір IP-ден
# минутына 30, ал бір сыныптың студенттері бір IP-ден (мектеп желісі) қатар
# кіре алуы үшін 60 сұранысқа дейін бірден өтеді (burst). Асса — 429.
map $request_method $ozp_login_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $ozp_login_limit_key zone=ozp_login:10m rate=30r/m;

server {
    listen 80;
    server_name test.example.kz;

    # Жүктелетін файлдың ең үлкен көлемі
    # Сұрақ формасы: сұрақ суреті + 4 жауап суреті, әрқайсы 2 МБ-қа дейін;
    # суреттері бар Excel импорты — 20 МБ-қа дейін (constants.IMPORT_MAX_MB)
    client_max_body_size 22M;

    # collectstatic жинаған CSS/JS
    location /static/ {
        alias /srv/ozp-test/staticfiles/;
        expires 7d;
    }

    # Оқытушы жүктеген суреттер
    location /media/ {
        alias /srv/ozp-test/media/;
        expires 7d;
    }

    # Кіру беті: жоғарыдағы шектеумен (қалғаны төмендегі location / сияқты)
    location = /accounts/login/ {
        limit_req zone=ozp_login burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django HTTPS екенін осы тақырыптан біледі (SECURE_PROXY_SSL_HEADER)
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
